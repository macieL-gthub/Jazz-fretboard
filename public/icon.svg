<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Tło gradientowe -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Złoty gradient akcentu jazzowego -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Podstrunnica (ciemny palisander/heban) -->
    <linearGradient id="fretboardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Struny z oplotem i wiolinowe -->
    <linearGradient id="stringWound" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="stringPlain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Poświata nut -->
    <filter id="glowGold" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Zaokrąglone tło aplikacji -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-opacity="0.35" />

  <!-- Sylwetka pudła archtop / gitary w tle -->
  <path d="M 120 440 C 120 360, 160 320, 200 300 C 170 270, 170 210, 220 180 C 210 140, 230 90, 256 60 C 282 90, 302 140, 292 180 C 342 210, 342 270, 312 300 C 352 320, 392 360, 392 440 Z" 
        fill="#f59e0b" fill-opacity="0.04" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.15" />

  <!-- Dedykowany gryf gitary w centrum -->
  <g transform="translate(96, 120)">
    <!-- Korpus podstrunnicy -->
    <rect x="0" y="0" width="320" height="260" rx="16" fill="url(#fretboardGrad)" stroke="#334155" stroke-width="3" />
    
    <!-- Progi gitarowe (fret wire) -->
    <line x1="80" y1="0" x2="80" y2="260" stroke="#94a3b8" stroke-width="4" />
    <line x1="160" y1="0" x2="160" y2="260" stroke="#cbd5e1" stroke-width="4.5" />
    <line x1="240" y1="0" x2="240" y2="260" stroke="#94a3b8" stroke-width="4" />

    <!-- Markery progów (inlays) -->
    <circle cx="160" cy="130" r="7" fill="#cbd5e1" fill-opacity="0.75" />

    <!-- 6 Strun gitary jazzowej (od basu do wiolinu) -->
    <line x1="0" y1="30" x2="320" y2="30" stroke="url(#stringWound)" stroke-width="5" />
    <line x1="0" y1="70" x2="320" y2="70" stroke="url(#stringWound)" stroke-width="4.2" />
    <line x1="0" y1="110" x2="320" y2="110" stroke="url(#stringWound)" stroke-width="3.5" />
    <line x1="0" y1="150" x2="320" y2="150" stroke="url(#stringPlain)" stroke-width="2.8" />
    <line x1="0" y1="190" x2="320" y2="190" stroke="url(#stringPlain)" stroke-width="2.2" />
    <line x1="0" y1="230" x2="320" y2="230" stroke="url(#stringPlain)" stroke-width="1.8" />

    <!-- Nuty pentatoniki nakładanej z kolorystyką z aplikacji -->
    <!-- Nuta 1: Złota Pryma (Root) na progu V, struna 4 -->
    <g transform="translate(160, 110)" filter="url(#glowGold)">
      <circle cx="0" cy="0" r="20" fill="#f59e0b" stroke="#ffffff" stroke-width="2.5" />
      <text x="0" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#000000" text-anchor="middle">R</text>
    </g>

    <!-- Nuta 2: Szmaragdowy Guide Tone (3 / 7) na progu III, struna 3 -->
    <g transform="translate(80, 150)">
      <circle cx="0" cy="0" r="18" fill="#10b981" stroke="#ffffff" stroke-width="2" />
      <text x="0" y="5" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">3</text>
    </g>

    <!-- Nuta 3: Różowy Kolor / Alteracja na progu VII, struna 2 -->
    <g transform="translate(240, 190)">
      <circle cx="0" cy="0" r="18" fill="#f43f5e" stroke="#ffffff" stroke-width="2" />
      <text x="0" y="5" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle">9</text>
    </g>

    <!-- Nuta 4: Fioletowy Passing Note (chromatyczny) na progu V, struna 1 -->
    <g transform="translate(160, 230)">
      <circle cx="0" cy="0" r="16" fill="#a855f7" stroke="#ffffff" stroke-width="2" />
      <text x="0" y="4" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">♭5</text>
    </g>
  </g>

  <!-- Stylowy napis na dole z logo -->
  <text x="256" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="3">JAZZ FRETBOARD</text>
  <text x="256" y="468" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="4">LAB • ANDROID &amp; PWA</text>
</svg>
